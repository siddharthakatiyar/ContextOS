name: Publish to NPM

on:
  push:
    tags:
      - 'v*' # Trigger when a version tag like v0.7.0 is pushed
  release:
    types: [published] # Also trigger when a GitHub release is created

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # ContextOS requires modern Node

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
      - name: Run tests
        run: npm test

      - name: Upgrade NPM for OIDC support
        run: npm install -g npm@latest

      - name: Publish to NPM
        run: npm publish --provenance --access public
