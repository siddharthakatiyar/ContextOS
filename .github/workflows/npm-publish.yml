name: Publish to NPM

on:
  release:
    types: [published] # Only trigger when a GitHub release is created

# Prevent double-publishing.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is on main branch
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Releases can only be published from the main branch. This commit is not on main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x' # ContextOS requires modern Node

      - name: Verify release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          TAG="${TAG#v}"
          PKG=$(node -p "require('./package.json').version")
          echo "tag=$TAG pkg=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} ($TAG) does not match package.json version $PKG"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        
      - name: Run tests
        run: npm test

      - name: Upgrade NPM for OIDC support
        run: npm install -g npm@latest

      - name: Publish to NPM
        run: npm publish --provenance --access public
