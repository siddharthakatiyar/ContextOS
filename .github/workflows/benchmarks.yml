name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Setup Headroom Python bridge dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure python3 is used by headroom bridge
          echo "HEADROOM_PYTHON=python3" >> $GITHUB_ENV
          # Context mode dependencies if needed
          # FTS search needs sqlite3, which is built-in
          
      - name: Run E2E Retrieval Benchmarks
        run: |
          npm run bench | tee benchmark_out.txt
          
          # Enforce 95% Recall (fail if below)
          # Grep the average recall line: "Average Recall: 98.5%"
          RECALL=$(grep -oP 'Average Recall: \K[0-9.]+' benchmark_out.txt || echo "0")
          echo "Measured Recall: $RECALL%"
          
          if (( $(echo "$RECALL < 95.0" | bc -l) )); then
            echo "::error::Recall $RECALL% is below the required 95.0% threshold."
            exit 1
          fi

      - name: Run 5-Way Architectural Benchmark
        run: |
          # This script takes a long time, but ensures there are no severe regressions
          # against baseline vector/FTS/grep search.
          node scripts/ab-4way-benchmark.mjs e2e
