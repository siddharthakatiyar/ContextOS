name: Benchmarks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build


      - name: Run E2E Retrieval Benchmarks
        run: |
          set -euo pipefail
          metrics_file="$RUNNER_TEMP/contextos-benchmark-metrics.json"
          node scripts/bench/run.mjs --json > "$metrics_file"
          node - "$metrics_file" <<'NODE'
          const fs = require('node:fs');
          const metrics = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const recall = Number(metrics.averageRecallPercent);
          console.log(`Measured recall: ${recall.toFixed(1)}%`);
          if (metrics.failed || !Number.isFinite(recall) || recall < 95) {
            console.error(`Benchmark gate failed: recall=${recall}%, failed=${metrics.failed}`);
            process.exit(1);
          }
          NODE
      - name: Verify benchmarks leave tracked files unchanged
        if: always()
        run: git diff --exit-code
