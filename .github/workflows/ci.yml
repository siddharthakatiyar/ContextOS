name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run coverage
      - name: Lint documentation
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run lint --workspace docs
      - name: Build documentation
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run build --workspace docs
      - name: Reject critical production advisories
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm audit --omit=dev --audit-level=critical
      - name: Smoke-test packed CLI
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: |
          PACKAGE_TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          npm install --prefix "$RUNNER_TEMP/contextos-smoke" "$RUNNER_TEMP/$PACKAGE_TARBALL" --no-audit --no-fund
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          "$RUNNER_TEMP/contextos-smoke/node_modules/.bin/contextos" --version | grep -Fx "$EXPECTED_VERSION"
          "$RUNNER_TEMP/contextos-smoke/node_modules/.bin/contextos" --help >/dev/null
