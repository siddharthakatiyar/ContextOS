name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run coverage
      - name: Lint documentation
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run lint --workspace docs
      - name: Build documentation
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm run build --workspace docs
      - name: Reject critical production advisories
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: npm audit --omit=dev --audit-level=critical
      - name: Validate installed release package
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x'
        run: |
          PACKAGE_TARBALL=$(npm pack --pack-destination "$RUNNER_TEMP" --silent)
          PREVIOUS_TARBALL=$(npm pack @siddharthakatiyar/contextos@1.1.1 --pack-destination "$RUNNER_TEMP" --silent)
          node scripts/release-package-test.mjs "$RUNNER_TEMP/$PACKAGE_TARBALL" "$RUNNER_TEMP/release-package-test.json" "$RUNNER_TEMP/$PREVIOUS_TARBALL"

      - name: Upload installed-package validation report
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '22.x' && always()
        uses: actions/upload-artifact@v4
        with:
          name: release-package-validation
          path: ${{ runner.temp }}/release-package-test.json
          if-no-files-found: ignore
